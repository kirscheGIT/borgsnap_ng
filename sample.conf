###############################################
# system configuration
###############################################
# User which runs the Backup
# It is prefeered to use a none root user. 
# Prerequsits: The user is in the snapshot allow
# list of zfs and is able to mount the snapshots
LOCAL_BORG_USER="root"

# Optional: message verbosity, overriding the level borgsnap_ng.sh
# otherwise hardcodes. 0=errors only, 1=+warnings (the hardcoded
# default), 2=+info (recommended if you want to see BORG_VERIFY/
# RESTORE_VERIFY/capacity-check confirmations even when everything
# passed, not just failures), 3=+verbose, 5=full debug. A genuine
# failure (ERROR-level) is always shown regardless of this setting -
# lowering it only hides routine confirmations and debug detail, never
# hides a real problem.
# MSG_LEVEL=2

# local filesystems to snapshot and backup
# semicolon (;) separated list of filesystems
# paired with a comma separated (,) parameter 
# which denotes if the filesystems has to be
# recursively mounted or not. A "r" or "R" marks
# that the file system is recursive. Any other
# or an empty value treats it as a single mount   
FS="zroot/root,; zroot/home,; zdata/data,r"

# WARNING: if a dataset is backed up BOTH recursively as part of a parent
# (the "r"/"R" flag above) AND separately, as its own independent FS=
# entry with its own config, snapshots cascade onto the child from the
# parent's recursive run - but neither config's retention (pruning) is
# aware of the other. Retention here is purely name/label-pattern based,
# not "who created this snapshot" based, so this only self-resolves if
# both configs run on matching interval schedules; if they don't, the
# cascaded snapshots on the child accumulate indefinitely, cleaned up by
# neither side.
#
# Example of the situation to avoid:
#   Config A: FS="tank/data,r"                    (recursive parent)
#   Config B: FS="tank/data/child,"                (same child, managed
#                                                    separately)
# Every recursive run of Config A also snapshots tank/data/child (as a
# side effect of "-r"), but Config A's own pruning never touches anything
# under tank/data/child - it only ever matches "tank/data@<label>-",
# never "tank/data/child@<label>-". Config B's pruning only manages the
# label pattern it itself schedules (e.g. only "monthly"). If Config A
# runs daily (cascading "daily"/"weekly" snapshots onto the child too)
# while Config B only ever runs monthly, those cascaded snapshots are
# never claimed by either side and pile up on tank/data/child forever.
#
# If you need both the parent and a specific child backed up, prefer one
# of: back up the parent recursively and accept the child comes along for
# free (skip the separate child config entirely), or keep both configs on
# the exact same interval schedule so their retention naturally reconciles
# via matching label patterns.

###############################################
# general borg repo settings
###############################################
# "auto,X" runs a cheap heuristic (LZ4 early-abort) before compressing
# with X, skipping compression entirely for data that's already
# compressed (video, archives, etc.) instead of wasting CPU on it. zstd
# level 3 is a good speed/ratio compromise for most workloads - level 9
# buys comparatively little extra ratio for a lot more CPU time.
COMPRESS="auto,zstd,3"

CACHEMODE="mtime,size"

PASS="/path/to/my/super/secret/myhost.key"

###############################################
# local borg repo settings
###############################################
# basedir for borg cache files - see README
BASEDIR=""
# control if borg repo is readable for other users
# [ ] TODO #28 Implement local readability of repos @kirscheGIT
LOCAL_READABLE_BY_OTHERS=false

###############################################
# repo settings
###############################################
# semicolon separated list of repos. It is 
# possible to have more than one remote or local
# repo. The remote repo has to be defined in the
# (backup) users ~/.ssh/config file 
# Besides the ssh config file, it is required to 
# have a certifcate based authorization
# as a second parameter - separated by a comma (,) - the remote borg command can 
# be put in
# an optional third parameter - also comma separated - sets the encryption
# mode for a fresh "borg init" (e.g. repokey-blake2). Defaults to "repokey"
# if left empty.
#
# Each entry may be prefixed with a backend type: "borg:" (default if no
# prefix is given), "zfssend:" (see filesystem/zfs_send_hdlr.sh), or
# "borgbase:" for BorgBase repos specifically. BorgBase's SSH access is
# locked to a forced command ("borg serve" only, no shell) - regular
# filesystem checks (mkdir etc.) never work there, so "borgbase:" uses
# borg's own "borg list" exit code to detect whether the repo (created via
# BorgBase's web UI beforehand, always exactly one fixed path) still needs
# "borg init". A generic ssh:// borg repo elsewhere (rsync.net, Hetzner
# Storage Box, your own server) uses plain "borg:" (or no prefix) as usual.
#
# examples for the repo list:
# 1. One local and one remote repo:
# REPOLIST="/path/to/local/repo, ; ssh://my-remote-server/path/to/remote/repo, ;"
# 2. Two local and two remote repos
# REPOLIST="/path/to/local/repo1, ; /path/to/local/repo2; ssh://my-remote-server-1/path/to/remote/repo, borg1; ssh://my-remote-server-2/path/to/remote/repo, boeg2;"
# 3. A BorgBase repo with a non-default encryption mode, alongside a local repo:
# REPOLIST="/path/to/local/repo, ; borgbase:ssh://borgbase_repo/./repo, borg, repokey-blake2"
REPOLIST="/path/to/local/repo, ; ssh://my-remote-server/path/to/remote/repo, borg1"

# Possibility to control if local or remote repos have to be skipped
# valid values are "REMOTE" "LOCAL" or "NONE"
REPOSKIP="NONE" 
                


###############################################
# backup retention period settings
###############################################
# Interval names must be exactly "monthly", "weekly", and "daily" -
# nothing else is recognized (unlike REPOLIST/REPOSKIP, which do accept
# arbitrary values). See SNAPSHOT_TAG below if you need these snapshots
# to be distinguishable from another tool's on the same dataset.
RETENTIONPERIOD="monthly,1;weekly,4;daily,7"

###############################################
# snapshot tag (optional)
###############################################
# Inserts a fixed prefix into every ZFS snapshot label this dataset
# gets: "TAG-monthly-20260730" instead of plain "monthly-20260730".
# Doesn't change RETENTIONPERIOD's interval names above (still exactly
# "monthly"/"weekly"/"daily") or borg archive names/repo paths - only
# the ZFS snapshot label.
#
# Use case: running borgsnap_ng on the same dataset as another backup
# tool that uses the same interval-date label convention (including the
# original, pre-fork borgsnap) - e.g. testing borgsnap_ng in parallel
# before migrating a pool over. Without a tag, both tools would try to
# create the exact same snapshot name and collide.
#
# Letters, digits, and underscore only - it becomes part of a real ZFS
# snapshot name.
#
# Example: testing borgsnap_ng on a pool the original borgsnap already
# backs up, distinguishing this tool's own snapshots:
# SNAPSHOT_TAG="ng"
SNAPSHOT_TAG=""

###############################################
# monthly trigger day (optional)
###############################################
# Which day-of-month triggers a fresh "monthly" snapshot/verify for THIS
# dataset. Defaults to 1 if unset - identical to every version of this
# tool before this option existed, so leaving it out changes nothing.
#
# Use case: if several datasets/repos share a destination account (e.g.
# several borgsnap_ng configs all backing up to the same BorgBase or
# Hetzner storagebox account) and all of them run BORG_VERIFY at "data"
# depth on their monthly, having every single one land on the 1st spikes
# load on the provider (and on this machine) all at once. Staggering
# MONTHLY_DAY across those configs spreads that load across the month
# instead.
#
# Restricted to 1-28: every month has at least 28 days, so any value in
# this range is guaranteed to occur every month. 29-31 would silently
# skip that dataset's ENTIRE monthly snapshot/verify (not just shift it
# by a day) in any month too short to contain it - e.g. 30 in February -
# so it's rejected up front instead of failing unpredictably once a
# year.
#
# Example: this dataset's monthly lands on the 10th instead of the 1st:
# MONTHLY_DAY=10
MONTHLY_DAY=1

###############################################
# restorability verification (optional)
###############################################
# Runs "borg check" at a configurable depth after pruning, so a
# corrupted/unrestorable repo is caught proactively instead of discovered
# during an actual disaster recovery attempt. Semicolon-separated
# interval:depth pairs, using the same interval names as RETENTIONPERIOD
# above (monthly/weekly/daily/etc.).
#
# A special "default:X" entry (instead of a real interval name) applies
# to any interval that doesn't have its own explicit entry - without one,
# adding a new interval to RETENTIONPERIOD (e.g. "hourly") without also
# remembering to update BORG_VERIFY would silently turn verification off
# for it, with no warning at all. An exact interval match always wins
# over "default:", regardless of which order they're listed in.
#
# Depth levels (cheapest to most thorough):
#   off     - no check at all (the fallback if BORG_VERIFY is empty/unset,
#             or an interval has neither its own entry nor a "default:"
#             one to fall back to)
#   repo    - "borg check --repository-only": segment/CRC integrity of
#             stored objects. Cheapest - for ssh:// repos this runs
#             server-side, barely any network traffic.
#   archive - "borg check --archives-only": archive metadata consistency
#             (manifest present, chunk references exist). Doesn't read
#             actual file content.
#   data    - "borg check --verify-data": full cryptographic verification
#             of ALL backed-up data - reads, decrypts, decompresses
#             everything. The only level that can catch bit-rot in the
#             actual file content, but by far the most expensive (time,
#             I/O, and for remote repos, network/bandwidth too).
#
# A problem found during a check is logged as a WARNING, not a fatal
# error - it does not abort the run (today's archive may be fine even if
# an older one has a problem), but it does escalate the notification
# email's subject/priority automatically if you're using mail_wrapper.sh.
#
# Other examples:
# never check on the frequent daily runs, do a cheap structural check
# weekly, and a full data verification once a month:
# BORG_VERIFY="daily:off;weekly:repo;monthly:data"
#
# a cheap structural check on every interval by default (including any
# not listed explicitly, like a later-added "hourly"), but a full data
# verification specifically once a month:
BORG_VERIFY="default:repo;monthly:data"

###############################################
# restore-path verification (optional)
###############################################
# BORG_VERIFY above proves the STORED BYTES are intact. This proves
# something different: that the actual RESTORE PATH works end to end -
# extraction, decryption, permissions, and for zfssend targets, mounting
# the received snapshot. borg check can never show this on its own, since
# it never actually pulls data back out through the real restore
# machinery the way a genuine disaster-recovery attempt would.
#
# How it works: before each run this is enabled for, a small "canary"
# file (.borgsnap_ng_canary) is written directly into the live dataset,
# with fresh content every time - not just a touch - so a pass proves
# THIS run's own new data made it through, not just that some untouched
# file from months ago still happens to be readable. After backup, the
# canary is read back from each destination (borg: extracted from the
# archive; zfssend: read from the target's own mounted snapshot) and
# compared against what was just written. Fully automatic - the file is
# created on first use and rewritten every run after that; nothing to set
# up by hand.
#
# Semicolon-separated interval:on/off pairs, same interval names as
# RETENTIONPERIOD/BORG_VERIFY above, with the same "default:" fallback
# pattern BORG_VERIFY has (see its comments above for why that matters).
# Unset/empty means no restore-path check at all, for every interval -
# preserves existing behavior for every config that predates this
# feature.
#
# A mismatch or extraction/mount failure is a genuine FAILURE, not a
# warning - it makes the whole run report as failed (nonzero exit,
# escalated FAILURE email if you're using mail_wrapper.sh) even if every
# other part of the run completed normally. A broken restore path is
# serious enough to warrant that, unlike an aging archive with some bit
# rot BORG_VERIFY might flag.
#
# The one unavoidable exception to this project's usual read-only
# approach to your data: writing the canary file requires the executing
# user to have WRITE access to the dataset's own live mountpoint - not
# just read access, which is all this project needs everywhere else.
# Make sure whichever user runs borgsnap_ng.sh actually has that before
# enabling this.
#
# Example: check restore-path integrity every time this dataset is backed
# up, regardless of which interval:
# RESTORE_VERIFY="default:on"
RESTORE_VERIFY=""

###############################################
# repo/target capacity reporting (optional)
###############################################
# After each backup, reports the destination's fill level: local and
# remote (ssh://) borg repos via "df", zfssend targets via the target
# pool's own capacity. Always logged at INFO level. Set
# CAPACITY_WARN_PERCENT to a percentage (0-100) to escalate to WARNING
# once a destination is at or above it - still doesn't abort the run (a
# full repo is worth a loud warning, not losing the rest of this run's
# other destinations over). Leave unset for INFO-only reporting with no
# warning escalation.
#
# Note: some remote borg providers' restricted SSH shells (see FIX #50's
# discussion of BorgBase) don't support "df" at all - capacity reporting
# for those degrades gracefully to a DEBUG-level skip note rather than an
# error.
# CAPACITY_WARN_PERCENT=85

###############################################
# scripts to be invoked before or after the 
# backup
###############################################
PRE_SCRIPT=
POST_SCRIPT=

###############################################
# email notification (optional, used by
# mail_wrapper.sh - see ops/README.md)
###############################################
# If set, mail_wrapper.sh sends exactly one email per run - SUCCESS or
# FAILURE, with the priority set accordingly - instead of relying on
# cron's own unreliable "mail on any output" behavior. If left empty (or
# omitted entirely), the backup still runs normally; mail_wrapper.sh just
# skips the email step.
MAILTO=""

# EOF